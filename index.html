<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Music Library</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      height: 100vh;
    }
    .hidden { display: none !important; }

    /* Login */
    #loginPage {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,#121212,#1db95422);
    }
    .login-box {
      background: #181818;
      padding: 2rem;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 0 30px rgba(0,0,0,.5);
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: white;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 24px;
      background: #1DB954;
      font-weight: bold;
      cursor: pointer;
    }

    /* App */
    #app {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 90px);
    }
    .sidebar {
      background: #000;
      padding: 20px;
      overflow-y: auto;
    }
    .sidebar h2 { color: #1DB954; }
    .track {
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      background: #181818;
    }
    .track:hover, .track.active { background: #282828; }

    .main {
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 1.2rem;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #181818;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 20px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
      margin-bottom: 8px;
    }
    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #1DB954;
      color: black;
      font-size: 18px;
      cursor: pointer;
    }
    #seekbar { width: 100%; }
  </style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">
    <h2>Private Library</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="mainPage" class="hidden">
  <div id="app">
    <div class="sidebar">
      <h2>Your Library</h2>
      <div id="trackList"></div>
    </div>
    <div class="main">
      Pick a track from the left 🎵
    </div>
  </div>

  <div class="player">
    <div class="controls">
      <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
      <button class="ctrl-btn" onclick="togglePlay()">⏯</button>
      <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
    </div>
    <input id="seekbar" type="range" value="0" min="0" max="100">
  </div>
</div>

<audio id="audio"></audio>

<script>
  const USERNAME = 'admin';
  const PASSWORD = 'changeme';

  let tracks = [];

  async function fetchTracks() {
    try {
      const response = await fetch('files/tracks.json');
      tracks = await response.json();
      loadTracks();
      if (tracks.length > 0) {
        loadTrack(0);
      }
    } catch (err) {
      console.error('Failed to load track list', err);
      alert('Could not load music library');
    }
  }

  let currentTrack = 0;
  const audio = document.getElementById('audio');
  const seekbar = document.getElementById('seekbar');

  function login() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;

    if (u === USERNAME && p === PASSWORD) {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('mainPage').classList.remove('hidden');
      fetchTracks();
    } else {
      alert('Wrong credentials');
    }
  }

  function loadTracks() {
    const list = document.getElementById('trackList');
    list.innerHTML = '';
    tracks.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'track';
      div.innerText = t.name;
      div.onclick = () => loadTrack(i, true);
      list.appendChild(div);
    });
  }

  function highlightTrack() {
    document.querySelectorAll('.track').forEach((el, i) => {
      el.classList.toggle('active', i === currentTrack);
    });
  }

  function loadTrack(i, autoplay=false) {
    currentTrack = i;
    audio.src = tracks[i].file;
    highlightTrack();
    if (autoplay) audio.play();
  }

  function togglePlay() {
    if (audio.paused) audio.play();
    else audio.pause();
  }

  function nextTrack() {
    currentTrack = (currentTrack + 1) % tracks.length;
    loadTrack(currentTrack, true);
  }

  function prevTrack() {
    currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
    loadTrack(currentTrack, true);
  }

  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      seekbar.value = (audio.currentTime / audio.duration) * 100;
    }
  });

  seekbar.addEventListener('input', () => {
    if (audio.duration) {
      audio.currentTime = (seekbar.value / 100) * audio.duration;
    }
  });

  audio.addEventListener('ended', nextTrack);
</script>

</body>
</html>
