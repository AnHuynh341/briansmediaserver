<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>W41IT</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      var(--bg-base): #050510;
      --bg-elevated: #0d0d20;
      --bg-highlight: #1a1a36;
      --accent: #00E5FF; 
      --accent-hover: #00b3cc;
      --success: #00ff66;
      --error: #ff3366;
      --text-main: #E0E0FF;
      --text-sub: #8B8BAE;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #050510;
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Styling for the Repeat One indicator */
#repeatBtn {
  position: relative;
}

#repeatBtn[data-repeat-one="true"]::after {
  content: '1';
  position: absolute;
  top: -2px;
  right: -5px;
  font-size: 10px;
  font-weight: 800;
  background: var(--bg-base);
  color: var(--success);
  border: 1px solid var(--success);
  border-radius: 50%;
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Drag & Drop Styles */
    .drop-zone {
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 32px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .drop-zone.dragover, .drop-zone:hover {
      border-color: var(--accent);
      background: rgba(0, 229, 255, 0.05);
    }
    .drop-zone i {
      font-size: 2rem;
      color: var(--text-sub);
      transition: color 0.2s;
    }
    .drop-zone.dragover i, .drop-zone:hover i {
      color: var(--accent);
    }
    #fileNameDisplay {
      font-size: 0.85rem;
      color: var(--success);
      font-weight: bold;
      word-break: break-all;
      text-align: center;
    }
    .ctrl-btn.active {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
      transform: scale(1.1);
    }

    .hidden { display: none !important; }

    /* --- Animations --- */
    @keyframes fadeOutUp {
      0% { opacity: 1; transform: scale(1); } 
      100% { opacity: 0; transform: scale(1.05); visibility: hidden; }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .animate-out { animation: fadeOutUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-in { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .shake-error { animation: shake 0.4s ease-in-out; }
/* --- Responsive Adjustments --- */
@media (max-width: 768px) {
    /* Login Box */
    .login-box {
        width: 90%;
        padding: 1.5rem;
    }

    /* Layout */
    #app-container {
        flex-direction: column;
    }

    /* Sidebar as a Drawer */
    .sidebar {
        position: fixed;
        left: -100%;
        top: 0;
        bottom: 90px;
        width: 85%;
        z-index: 1000;
        transition: 0.3s ease-in-out;
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    .sidebar.mobile-active {
        left: 0;
    }

    /* Main View & Header */
    .main-view {
        padding: 16px;
    }

    .view-header-container {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }

    .view-header {
        font-size: 1.8rem;
    }

    .btn-edit-playlist {
        width: 100%; /* Make button easy to tap */
        justify-content: center;
        padding: 12px;
    }

    /* Modals (Upload & Playlist) */
    .modal-content {
        width: 95%;
        max-height: 90vh;
        padding: 16px;
    }

    .track-selection-area {
        max-height: 200px;
    }

    /* Track List Adjustments */
    .track-list-header, .track {
        grid-template-columns: 30px 1fr 60px;
    }

    .track-genre {
        display: none;
    }

    /* Player Bar for Mobile */
    .player {
        grid-template-columns: 1fr 100px;
        height: 100px;
        padding: 0 12px;
    }

    .right-controls {
        display: none;
    }

    .player-controls {
        align-items: flex-end;
    }

    .buttons {
        gap: 12px;
    }

    #shuffleBtn, #repeatBtn {
        display: none;
    }

    .progress-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 0;
    }

    .progress-container .time {
        display: none;
    }

    input[type=range] {
        height: 4px;
        border-radius: 0;
    }

    /* Mobile Menu Toggle Button */
    #mobileMenuBtn {
        display: block !important;
        background: none;
        border: none;
        color: var(--accent);
        font-size: 1.5rem;
        margin-bottom: 15px;
        cursor: pointer;
    }
}

    /* Login Page */
    #loginPage {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #050510 0%, #00e5ff22 100%);
      position: fixed;
      width: 100%;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    .login-box {
      background: var(--bg-elevated);
      padding: 2.5rem;
      border-radius: 12px;
      width: 340px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 229, 255, 0.15);
      border: 1px solid rgba(0, 229, 255, 0.1);
      transition: transform 0.3s;
    }
    .login-box h2 {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .login-box h2 i { color: var(--accent); }
    .login-box input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      transition: border 0.3s, background 0.3s;
    }
    .login-box input:focus {
      outline: none;
      border: 1px solid var(--accent);
      background: rgba(0, 229, 255, 0.05);
    }
    #loginBtn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: none;
      border-radius: 500px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #loginBtn:hover { background: var(--accent-hover); transform: scale(1.02); box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
    #loginBtn.btn-success { background: var(--success); box-shadow: 0 0 20px rgba(0, 255, 102, 0.5); }
    #loginBtn.btn-error { background: var(--error); color: white; box-shadow: 0 0 20px rgba(255, 51, 102, 0.5); }

    /* Main App Layout */
    #app-container { display: flex; height: calc(100vh - 90px); width: 100%; }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #020208;
      display: flex;
      flex-direction: column;
      padding-top: 24px;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }
    .nav-links { padding: 0 24px; margin-bottom: 24px; }
    .nav-item {
      display: flex; align-items: center; gap: 16px;
      color: var(--text-sub); font-weight: 600; padding: 10px 0;
      cursor: pointer; transition: color 0.2s;
    }
    .nav-item:hover, .nav-item.active { color: var(--text-main); }
    .nav-item.active i { color: var(--accent); }
    .nav-item i { font-size: 1.2rem; width: 24px; text-align: center; }

    .library-section {
      flex: 1; background: #050510; margin: 0 8px;
      border-radius: 8px; padding: 16px; overflow-y: auto;
    }
    .library-header {
      display: flex; justify-content: space-between; align-items: center;
      color: var(--text-sub); font-weight: bold; margin-bottom: 16px;
      font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
    }
    .library-header i.fa-plus { transition: color 0.2s; padding: 4px; }
    .library-header i.fa-plus:hover { color: var(--accent); }
    .playlist-item {
      padding: 8px; border-radius: 4px; color: var(--text-sub);
      cursor: pointer; display: flex; align-items: center; gap: 12px;
      transition: all 0.2s;
    }
    .playlist-item:hover { background: var(--bg-elevated); color: var(--text-main); transform: translateX(4px); }
    .playlist-item.active { background: rgba(0, 229, 255, 0.1); color: var(--accent); }

    /* Main Content Area */
    .main-view {
      flex: 1; background: linear-gradient(180deg, #11112b 0%, #050510 100%);
      padding: 24px; overflow-y: auto;
    }
    .view-header-container {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 24px;
    }
    .view-header { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; margin: 0;}
    
    .btn-edit-playlist {
      background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px; border-radius: 500px; cursor: pointer; font-weight: bold;
      transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .btn-edit-playlist:hover { background: rgba(0, 229, 255, 0.1); border-color: var(--accent); color: var(--accent); }

    .track-list-header {
      display: grid; grid-template-columns: 40px 1fr 100px;
      color: var(--text-sub); padding: 8px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 12px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
    }

    .track {
      display: grid; grid-template-columns: 40px 1fr 100px;
      align-items: center; padding: 8px 16px; border-radius: 6px;
      cursor: pointer; transition: background 0.2s;
    }
    .track:hover { background: rgba(0, 229, 255, 0.05); }
    .track.active { background: rgba(0, 229, 255, 0.1); color: var(--accent); }
    .track.active .track-title { color: var(--accent); }
    
    .track-num { color: var(--text-sub); font-size: 0.9rem; }
    .track-info { display: flex; flex-direction: column; }
    .track-title { font-weight: 500; color: var(--text-main); }
    .track-meta { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
    .track-genre { color: var(--accent); font-weight: 600; font-size: 0.75rem; border: 1px solid rgba(0,229,255,0.3); padding: 2px 6px; border-radius: 4px; margin-left: 8px;}
    
    /* Player Bar */
    .player {
      height: 90px; background: var(--bg-elevated); border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: grid; grid-template-columns: 30% 40% 30%; padding: 0 16px; align-items: center; z-index: 100;
    }

    .now-playing { display: flex; align-items: center; gap: 14px; }
    .album-art {
      width: 56px; height: 56px; background: linear-gradient(135deg, var(--bg-highlight), #050510);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      display: flex; align-items: center; justify-content: center; color: var(--text-sub);
    }
    .np-info { display: flex; flex-direction: column; overflow: hidden; }
    .np-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .np-artist { font-size: 0.8rem; color: var(--text-sub); }

    .player-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .buttons { display: flex; align-items: center; gap: 24px; }
    .ctrl-btn { background: none; border: none; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; transition: color 0.2s, transform 0.1s; }
    .ctrl-btn:hover { color: var(--accent); transform: scale(1.1); }
    .play-btn {
      background: var(--text-main); color: #050510; width: 36px; height: 36px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; transition: all 0.2s;
    }
    .play-btn:hover { transform: scale(1.05); background: var(--accent); box-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }

    .progress-container { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 600px; }
    .time { font-size: 0.75rem; color: var(--text-sub); min-width: 40px; text-align: center; }
    
    input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; opacity: 0; transition: opacity 0.2s, transform 0.1s; }
    input[type=range]:hover::-webkit-slider-thumb { opacity: 1; transform: scale(1.2); }

    .right-controls { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
    .volume-bar { width: 100px; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 5, 0.85); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center; z-index: 2000;
    }
    .modal-content {
      background: var(--bg-elevated); padding: 24px; border-radius: 12px;
      width: 450px; max-height: 80vh; display: flex; flex-direction: column;
      border: 1px solid rgba(0, 229, 255, 0.2); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
    .modal-content h3 { margin-bottom: 16px; color: var(--accent); letter-spacing: 1px; }
    
    /* Shared Input Styles for Modals */
    .modal-content input[type="text"], .modal-content select, .modal-content input[type="file"] {
      width: 100%; padding: 12px; margin-bottom: 16px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent; color: white; border-radius: 6px; outline: none; font-family: inherit;
    }
    .modal-content input[type="text"]:focus, .modal-content select:focus { border: 1px solid var(--accent); }
    .modal-content select option { background: var(--bg-elevated); color: white; }
    .modal-content label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 1px;}

    .track-selection-area {
      flex: 1; overflow-y: auto; margin-bottom: 16px; background: #050510;
      padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);
    }
    .track-checkbox-item {
      display: flex; align-items: center; gap: 10px; padding: 10px; cursor: pointer;
      border-radius: 4px; color: var(--text-sub); transition: background 0.2s;
    }
    .track-checkbox-item:hover { background: rgba(0, 229, 255, 0.05); color: var(--text-main); }
    .track-checkbox-item input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; width: 16px; height: 16px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
    .modal-actions button { padding: 10px 20px; border: none; border-radius: 500px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    .btn-cancel { background: transparent; color: var(--text-sub); border: 1px solid rgba(255,255,255,0.1); }
    .btn-cancel:hover { background: rgba(255,255,255,0.05); color: white; }
    .btn-save { background: var(--accent); color: #000; box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }
    .btn-save:hover { background: var(--accent-hover); box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
    .status-text { font-size: 0.85rem; text-align: center; margin-bottom: 12px; font-weight: bold;}

  </style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">
    <h2><i class="fas fa-wave-square"></i> W41IT</h2>
    <input id="username" placeholder="Username" autocomplete="off">
    <input id="password" type="password" placeholder="Password" onkeypress="handleKeyPress(event)">
    <button id="loginBtn" onclick="login()">Enter System</button>
  </div>
</div>

<div id="mainPage" class="hidden">
  <div id="app-container">
    
    <div class="sidebar">
      <div class="nav-links">
        <div class="nav-item active" id="navAllTracks" onclick="showAllTracks()">
          <i class="fas fa-satellite-dish"></i> Database
        </div>
        <div class="nav-item" onclick="openUploadModal()">
          <i class="fas fa-cloud-upload-alt"></i> Upload Signal
        </div>
      </div>
      
      <div class="library-section">
        <div class="library-header">
          <span><i class="fas fa-layer-group"></i> Collections</span>
          <i class="fas fa-plus" style="cursor:pointer;" title="Create Playlist" onclick="openPlaylistModal()"></i>
        </div>
        <div id="playlists">
          </div>
      </div>
    </div>

    <div class="main-view">
      <div class="view-header-container">
        <h1 class="view-header" id="viewTitle">All Tracks</h1>
        <button id="editPlaylistBtn" class="btn-edit-playlist hidden" onclick="openEditModal()">
          <i class="fas fa-pen"></i> Add/Edit Songs
        </button>
      </div>
      
      <div class="track-list-header">
        <div>#</div>
        <div>Signal Identifier</div>
        <div><i class="far fa-clock"></i></div>
      </div>
      
      <div id="trackList">
        </div>
    </div>
  </div>

  <div class="player">
    <div class="now-playing">
      <div class="album-art" id="npArt"><i class="fas fa-bolt"></i></div>
      <div class="np-info">
        <span class="np-title" id="npTitle">System Idle</span>
        <span class="np-artist" id="npArtist">--</span>
      </div>
    </div>

    <div class="player-controls">
    <div class="buttons">
  <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
  <button class="ctrl-btn" onclick="prevTrack()"><i class="fas fa-step-backward"></i></button>
  <button class="ctrl-btn play-btn" onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></button>
  <button class="ctrl-btn" onclick="nextTrack()"><i class="fas fa-step-forward"></i></button>
  <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()"><i class="fas fa-redo-alt"></i></button>
</div>
      <div class="progress-container">
        <span class="time" id="currentTime">0:00</span>
        <input id="seekbar" type="range" value="0" min="0" max="100">
        <span class="time" id="totalTime">0:00</span>
      </div>
    </div>

    <div class="right-controls">
      <i class="fas fa-volume-up" style="color:var(--text-sub); font-size: 0.9rem;"></i>
      <input id="volumebar" class="volume-bar" type="range" value="100" min="0" max="100">
    </div>
  </div>
</div>

<div id="playlistModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 id="modalTitle">CREATE PLAYLIST</h3>
    <input type="hidden" id="editPlaylistIndex" value="-1">
    <input type="text" id="newPlaylistName" placeholder="Collection Designation..." autocomplete="off">
    
    <div class="track-selection-area" id="modalTrackSelection">
      </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePlaylistModal()">Cancel</button>
      <button class="btn-save" id="modalSaveBtn" onclick="savePlaylist()">Save Playlist</button>
    </div>
  </div>
</div>

<div id="uploadModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>TRANSMIT NEW SIGNAL</h3>
    
<div id="dropZone" class="drop-zone">
      <i class="fas fa-cloud-upload-alt"></i>
      <span style="font-weight: bold; color: var(--text-main);">Drag & Drop .mp3 here</span>
      <span style="font-size: 0.75rem; color: var(--text-sub);">or click to browse</span>
      <div id="fileNameDisplay"></div>
      <input type="file" id="uploadFileInput" accept=".mp3" style="display: none;">
    </div>
    
    <label>Track Name</label>
    <input type="text" id="uploadTrackName" placeholder="E.g., Night Dancer" autocomplete="off">
    
    <label>Artist Name</label>
    <input type="text" id="uploadArtistName" placeholder="E.g., imase" autocomplete="off">
    
    <label>Genre</label>
    <select id="uploadGenre">
      <option value="J-POP">J-POP</option>
      <option value="V-POP">V-POP</option>
      <option value="US-UK">US-UK</option>
      <option value="EDM">EDM</option>
      <option value="Other">Other</option>
    </select>

    <div id="uploadStatus" class="status-text"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeUploadModal()">Abort</button>
      <button class="btn-save" id="startUploadBtn">Transmit to Cloud</button>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

<script src="script.js"></script>
</body>
</html>
